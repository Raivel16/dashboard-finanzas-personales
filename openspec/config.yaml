schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Tech stack: MERN (MongoDB, Express, React, Node.js).
  REST API in Express with JWT auth and RBAC; React frontend with Chart.js and SweetAlert2.
  Every user-owned MongoDB document stores tenantId and usuarioId; repositories always filter by tenantId.
  Backend uses MVC; frontend uses Screaming Architecture. UI follows DESIGN.md.
  Every requirement cites its user story (Origen: HU-xx) or technical requirement (Origen: RT-xx); user stories are functional only. See docs/trazabilidad.md.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
